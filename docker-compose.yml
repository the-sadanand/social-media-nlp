services:
  app:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./src:/app/src
    command: >
      sh -c "python run_pipeline.py &&
             streamlit run app.py
               --server.port=8501
               --server.address=0.0.0.0
               --server.headless=true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    environment:
      PYTHONUNBUFFERED: "1"
    # Development configuration: source/data/output mounts are intentionally writable.
    # Do not use this Compose file as a production deployment configuration.
